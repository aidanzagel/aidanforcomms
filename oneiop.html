        <div class="pm-gal">${PROGRAMS.map((p) => `<button type="button" data-pmpick="${esc(p.id)}" aria-pressed="${p.id === o.p}"><img alt="" data-gal="${esc(p.id)}"><span>${esc(p.name)}</span></button>`).join('')}</div>`;
    },
    scorecard() {
      const rows = PROGRAMS.map((p) => [p, POSTS_THIS_TERM[p.id] || 0]).sort((a, b) => b[1] - a[1]);
      const fair = rows.reduce((s, [, n]) => s + n, 0) / rows.length, max = Math.max(...rows.map(([, n]) => n)) * 1.08;
      const low = (n) => n < fair - 1;
      const tiles = [['9.4', 'hrs', 'Average time to a first draft', 'The promise: under 24 hours'], ['96', '%', 'Requests answered on time', '48 of 50 this semester'], ['22', 'hrs', 'Average wait for event photos', 'The promise: within 24 hours'], ['14', 'of 21', 'Programs spotlighted', 'All 21 by the end of the semester']];
      return `
        <header class="v-head"><h1>Comms scorecard</h1><p>Every comms promise, measured in public and updated each Monday, so any member can check whether we’re keeping them. These are sample numbers showing how it would look mid-semester.</p></header>
        <div class="sc-tiles">${tiles.map(([n, unit, l, s]) => `<div class="card sc-tile"><b>${n}<small>${unit}</small></b><span>${l}</span><small>${s}</small></div>`).join('')}</div>
        <div class="grid-2">
          <div>
            ${secTitle('Posts on IOP channels, by program', 'This semester')}
            <div class="card sc-bars">
              <p class="sc-legend"><span><i class="k-fair"></i>Fair share: ${fair.toFixed(1)} posts each</span><span><i></i>More than a post behind, so they go first next week</span></p>
              ${rows.map(([p, n]) => `<div class="sc-bar${low(n) ? ' low' : ''}"><button type="button" data-prog="${esc(p.id)}" title="${esc(p.name)}">${esc(p.id)}</button><span class="sc-track" aria-hidden="true"><i style="--w:${(n / max * 100).toFixed(1)}%"></i><u style="--f:${(fair / max * 100).toFixed(1)}%"></u></span><output aria-label="${plural(n, 'post')}">${n}</output></div>`).join('')}
            </div>
          </div>
          <div>
            ${secTitle('The promises')}
            <div class="card sc-promises">${PROMISES().map(([t, d, cls, st, to, act]) => `<div class="sc-p"><b>${esc(t)}</b><span class="st ${cls}">${esc(st)}</span><p>${esc(d)}${to ? ` <button type="button" class="linkish" data-goto="${to}">${esc(act)} →</button>` : ''}</p></div>`).join('')}</div>
            ${secTitle('Spotlight queue', `${SPOT_QUEUE.length} to go`)}
            <ol class="card sc-queue">${SPOT_QUEUE.map(([id, d]) => `<li><button type="button" data-prog="${esc(id)}">${esc(prog(id).name)}</button><span>${esc(fmtDate(addDays(DAYS[0].date, d)))}</span></li>`).join('')}</ol>
          </div>

    search(q) {
      const m = (s) => s.toLowerCase().includes(q.toLowerCase());
      const evs = EVENTS.filter((e) => m([e.title, e.host, e.desc, e.p, prog(e.p).name, e.where].join(' '))).sort(byTime);
      const ps = PROGRAMS.filter((p) => m(p.id + ' ' + p.name + ' ' + p.about));
      const ns = newsFor().filter((n) => m(n.title + ' ' + n.body + ' ' + (n.p || '') + ' ' + n.from));
      const pp = STAFF.filter((s) => m(s.name + ' ' + s.title + ' ' + (s.p || '')));
      const total = evs.length + ps.length + ns.length + pp.length;
      return `
        <header class="v-head"><h1>Search</h1><p>${plural(total, 'result')} for “${esc(q)}”</p></header>
        ${ps.length ? secTitle('Programs', String(ps.length)) + `<div class="progs">${ps.map(progCard).join('')}</div>` : ''}
        ${evs.length ? secTitle('Events', String(evs.length)) + evGrid(evs) : ''}
        ${pp.length ? secTitle('Student leaders', String(pp.length)) + `<div class="staff">${pp.map(personCard).join('')}</div>` : ''}
        ${ns.length ? secTitle('Announcements', String(ns.length)) + `<div class="news">${ns.map(postCard).join('')}</div>` : ''}
        ${total ? '' : '<div class="card empty">Nothing matches. Try a name, a program like “Forum”, or a topic like “midterms”.</div>'}`;
    },
  };
  const dirList = () => {
    const q = state.dq.trim().toLowerCase();
    const list = STAFF.filter((s) => (state.dept === 'all' || (state.dept === 'mine' ? following.has(s.p) : s.dept === state.dept)) && (!q || [s.name, s.title, s.p || '', s.p ? prog(s.p).name : ''].join(' ').toLowerCase().includes(q)));
    if (state.dept === 'mine' && !list.length && !q) return '<div id="dir-list"><div class="card empty">None of your programs have chairs listed yet.</div></div>';
    return `<div id="dir-list">${DEPTS.filter(([k]) => list.some((s) => s.dept === k)).map(([k, l]) => `
      <section class="dept"><div class="dept-head"><h2>${esc(l)}</h2></div>
        <div class="staff">${list.filter((s) => s.dept === k).map(personCard).join('')}</div>
      </section>`).join('') || '<div class="card empty">No one matches that search.</div>'}</div>`;
  };
  const progCard = (p) => { const n = EVENTS.filter((e) => e.p === p.id).length; return `
    <button type="button" class="card pg${p.cat === 'coalition' ? ' coal' : ''}" data-prog="${esc(p.id)}">
      <span class="abbr">${esc(p.id)}</span><h3>${esc(p.name)}</h3>
      <span class="meta"><span>${n ? `${plural(n, 'event')} this week` : 'No events this week'}</span>${following.has(p.id) ? '<b>Your program</b>' : ''}</span>
    </button>`; };
  const personCard = (s) => `
    <article class="card person${s.dept === 'exec' ? ' lead' : ''}"><i aria-hidden="true">${esc(initials(s.name))}</i>
      <div><h3>${esc(s.name)}</h3><p>${esc(s.title)}${s.year ? ` · Class of ${s.year}` : ''}</p>

      <header><b>${profile.guest ? 'Guest' : esc(profile.name || 'IOP member')}</b><span>${profile.guest ? 'Looking around' : profile.year ? `Class of ${esc(profile.year)}` : 'Member'} · ${plural(following.size, 'program')}</span>
        <div class="tags">${[...following].map((id) => tag(id)).join('')}</div></header>
      <button type="button" role="menuitem" data-m="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>`;
    meMenu.hidden = !open;
    meBtn.setAttribute('aria-expanded', open);
  });
  meMenu.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-m]');
    if (!b) return;
    meMenu.hidden = true; meBtn.setAttribute('aria-expanded', false);
    if (b.dataset.m === 'settings') openSettings();
  });
  addEventListener('click', (ev) => { if (!meMenu.hidden && !ev.target.closest('.me')) { meMenu.hidden = true; meBtn.setAttribute('aria-expanded', false); } });

  $('#settings-btn').addEventListener('click', openSettings);
  buildNews();
  updateCount();
  if (!profile || profile.guest || !profile.programs) { profile = { name: '', year: '', guest: false, programs: PROGRAMS.map((p) => p.id) }; store.set('profile', profile); }
  syncFollowing();
  enter();
  // A link can open a section: /oneiop?view=events (also programs, people, news, request, maker, scorecard)
  try {
    const v = new URLSearchParams(location.search).get('view');
    if (v && v !== 'home' && document.querySelector(`.views [data-view="${CSS.escape(v)}"]`)) go(v);
  } catch (e) {}

  // Pick up the latest daily refresh (events.json, next to this page) when it's newer than the built-in copy
  fetch('events.json', { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => {
      if (!d || !Array.isArray(d.events) || (d.updated || '') < (DATA.updated || '')) return;
      loadEvents(d); buildNews(); updateCount();
      if (document.fonts?.status === 'loaded' && IOP_LOGO.white.complete) genSampleArt();
      if (!appEl.hidden) render();
    })
    .catch(() => {});
</script>
</body>
</html>
