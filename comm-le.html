<style>
  :root {
    --navy: #1b2384;
    --red: #d7101b;
    --paper: #f4f1ea;
    --ink: #10143d;
    --muted: #5d607c;
    --line: rgba(16, 20, 61, .2);

    --key: #e9e3d5;
    --key-hover: #e0d8c6;
    --edge: #cfc7b5;
    --edge-filled: #8a8473;

    /* Letter states */
    --hit: #1b2384;      /* right letter, right spot */
    --near: #f4d77f;     /* in the word, wrong spot */
    --miss: #a29b8a;     /* not in the word */

    --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --display: "Sofia Sans Extra Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  .wrap {
    width: 100%; max-width: 520px; margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .top { border-bottom: 1px solid var(--line); }
  .top .wrap { max-width: 1320px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
  .brand { display: flex; align-items: center; min-width: 0; }
  .brand img { display: block; height: 26px; width: auto; max-width: 100%; }
  @media (max-width: 560px) { .brand img { height: 20px; } }
  .top a.back { flex: none; font-size: 14.5px; font-weight: 600; color: var(--navy); text-decoration: none; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--navy); transition: background .2s, color .2s; }
  .top a.back:hover { background: var(--navy); color: #fff; }

  main { padding-block: 28px 40px; }
  .intro { display: grid; gap: 6px; margin-bottom: 22px; text-align: center; }
  h1 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(54px, 13vw, 86px); line-height: .84; color: var(--navy); }
  h1 span { color: var(--red); }
  .intro p { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--muted); }

  /* Board */
  .board { display: grid; gap: 7px; width: min(100%, 340px); margin-inline: auto; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .row.shake { animation: shake .45s; }
  .cell {
    display: grid; place-items: center; aspect-ratio: 1; max-width: 100%;
    border: 2px solid var(--edge); border-radius: 8px; background: transparent;
    font-family: var(--display); font-weight: 900; font-size: clamp(30px, 9vw, 40px); line-height: 1; text-transform: uppercase;
  }
  .cell.filled { border-color: var(--edge-filled); animation: pop .12s; }
  .cell.hit, .cell.near, .cell.miss { border-color: transparent; }
  .cell.hit { background: var(--hit); color: #fff; }
  .cell.near { background: var(--near); color: var(--ink); }
  .cell.miss { background: var(--miss); color: #fff; }
  .cell.flip { animation: flip .5s ease-in-out both; }
  .cell.win { animation: win .5s var(--ease) both; }
  @keyframes pop { 50% { transform: scale(1.1); } }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
  @keyframes shake { 15%, 55% { transform: translateX(-6px); } 35%, 75% { transform: translateX(6px); } }
  @keyframes win { 40% { transform: translateY(-14px); } 70% { transform: translateY(3px); } }

  /* Keyboard */
  .kb { display: grid; gap: 7px; margin-top: 26px; max-width: 500px; margin-inline: auto; touch-action: manipulation; }
  .kb-row { display: flex; justify-content: center; gap: 5px; }
  .key {
    flex: 1 1 0; min-width: 0; height: 56px; border: 0; border-radius: 8px; background: var(--key);
    font-weight: 700; font-size: 15px; text-transform: uppercase; cursor: pointer; user-select: none;
    transition: background .2s, color .2s, transform .1s;
  }
  .key:hover { background: var(--key-hover); }
  .key:active { transform: scale(.94); }
  .key.wide { flex: 1.6 1 0; font-size: 12.5px; }
  .key.wide svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  .key.hit { background: var(--hit); color: #fff; }
  .key.near { background: var(--near); color: var(--ink); }
  .key.miss { background: var(--miss); color: #fff; }
  .kb-row .spacer { flex: .5 1 0; }

  @media (max-height: 880px) {
    main { padding-block: 18px 28px; }
    .intro { margin-bottom: 14px; }
    h1 { font-size: clamp(46px, 11vw, 70px); }
    .intro p { font-size: 18px; }
    .board { width: min(100%, 290px); gap: 6px; }
    .row { gap: 6px; }
    .kb { margin-top: 16px; }
    .key { height: 52px; }
  }
  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 90px); z-index: 10;
    padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--paper);
    font-weight: 600; font-size: 15px; translate: -50% 0; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  /* End card */
  .end { display: grid; gap: 14px; justify-items: center; margin-top: 26px; padding: 24px 20px 0; border-top: 1px solid var(--line); text-align: center; }
  .end h2 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 46px; line-height: .9; color: var(--navy); }
  .end > p { font-family: var(--serif); font-size: 19px; max-width: 34ch; text-wrap: balance; }
  .end > p b { font-family: var(--sans); letter-spacing: .06em; }
  .end pre { font-family: inherit; font-size: 20px; line-height: 1.15; letter-spacing: 2px; }
  .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
  .btn { padding: 12px 22px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; font-size: 15.5px; font-weight: 600; cursor: pointer; text-decoration: none; color: inherit; transition: background .2s, color .2s; }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover { background: #b80d17; border-color: #b80d17; }
  .end small { font-size: 14px; color: var(--muted); }
</style>

  const START = Date.UTC(2026, 10, 9); // puzzle #1
  const today = new Date();
  const dayNo = Math.floor((Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) - START) / 864e5);
  const puzzle = ((dayNo % ANSWERS.length) + ANSWERS.length) % ANSWERS.length;
  const ANSWER = ANSWERS[puzzle];
  const KEY = `comm-le-${dayNo}`;
  const SQUARES = { hit: '🟦', near: '🟨', miss: '⬜' };
  const BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m16 9-5 6m0-6 5 6"/></svg>';

  const $ = (id) => document.getElementById(id);
  let guesses = [], current = '', over = false, busy = false;

  // Score a guess the standard way: exact matches first, then leftover letters
  const score = (guess) => {
    const res = Array(5).fill('miss'), left = {};
    for (let i = 0; i < 5; i++) {
      if (guess[i] === ANSWER[i]) res[i] = 'hit';
      else left[ANSWER[i]] = (left[ANSWER[i]] || 0) + 1;
    }
    for (let i = 0; i < 5; i++) {
      if (res[i] !== 'hit' && left[guess[i]]) { res[i] = 'near'; left[guess[i]]--; }
    }
    return res;
  };

  // Board
  $('board').innerHTML = Array.from({ length: 6 }, () =>
    `<div class="row">${'<div class="cell"></div>'.repeat(5)}</div>`).join('');
  const rows = [...$('board').children];
  const cells = (r) => [...rows[r].children];

  // Keyboard
  const LAYOUT = ['qwertyuiop', ' asdfghjkl ', '+zxcvbnm-'];
  $('kb').innerHTML = LAYOUT.map((r) => `<div class="kb-row">${[...r].map((k) =>
    k === ' ' ? '<span class="spacer"></span>'
    : k === '+' ? '<button type="button" class="key wide" data-k="Enter">Enter</button>'
    : k === '-' ? `<button type="button" class="key wide" data-k="Backspace" aria-label="Delete">${BACK}</button>`
    : `<button type="button" class="key" data-k="${k}">${k}</button>`).join('')}</div>`).join('');
  const RANK = { miss: 1, near: 2, hit: 3 };
  const paintKeys = () => {
    const best = {};
    guesses.forEach((g) => score(g).forEach((s, i) => { if (!best[g[i]] || RANK[s] > RANK[best[g[i]]]) best[g[i]] = s; }));
    document.querySelectorAll('.key[data-k]').forEach((k) => {
      k.classList.remove('hit', 'near', 'miss');
      if (best[k.dataset.k]) k.classList.add(best[k.dataset.k]);
    });
  };

  let toastTimer;
  const toast = (msg, ms = 1600) => {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  };

  const drawCurrent = () => {
    const r = guesses.length;
    if (r > 5) return;
    cells(r).forEach((c, i) => {
      const ch = current[i] || '';
      if (c.textContent !== ch) { c.textContent = ch; c.classList.toggle('filled', !!ch); }
    });
  };

  const paintRow = (r, word, animate) => {
    const res = score(word);
    return new Promise((done) => cells(r).forEach((c, i) => {
      c.textContent = word[i];
      if (!animate) { c.className = `cell ${res[i]}`; if (i === 4) done(); return; }
      setTimeout(() => {
        c.classList.add('flip');
        setTimeout(() => { c.className = `cell flip ${res[i]}`; }, 250);
        if (i === 4) setTimeout(done, 520);
      }, i * 280);
    }));
  };

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(guesses)); } catch {} };

  const PRAISE = ['Unbelievable.', 'Brilliant.', 'Impressive.', 'Nicely done.', 'Solid.', 'Close call.'];
  const finish = (won, animate) => {
    over = true;
    const showEnd = () => {
      $('end').hidden = false;
      $('end-hl').textContent = won ? PRAISE[guesses.length - 1] : 'Next time.';
      $('end-msg').innerHTML = won
        ? `You got it in ${guesses.length === 1 ? 'one' : guesses.length}. Today’s word was <b>${ANSWER.toUpperCase()}</b>.`
        : `Today’s word was <b>${ANSWER.toUpperCase()}</b>.`;
      $('grid-result').textContent = guesses.map((g) => score(g).map((s) => SQUARES[s]).join('')).join('\n');
      $('next').textContent = 'A new word every day at midnight.';
      if (animate) $('end').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    if (won && animate) {
      cells(guesses.length - 1).forEach((c, i) => setTimeout(() => c.classList.add('win'), i * 90));
      setTimeout(showEnd, 900);
    } else if (!won && animate) { toast(ANSWER.toUpperCase(), 2600); setTimeout(showEnd, 900); }
    else showEnd();
  };

  const submit = async () => {
    if (current.length < 5) { rows[guesses.length].classList.add('shake'); toast('Not enough letters'); }
    else if (!WORDS.has(current)) { rows[guesses.length].classList.add('shake'); toast('Not in word list'); }
    else {
      const word = current, r = guesses.length;
      busy = true; current = '';
      guesses.push(word); save();
      await paintRow(r, word, true);
      paintKeys(); busy = false;
      if (word === ANSWER) finish(true, true);
      else if (guesses.length === 6) finish(false, true);
      return;
    }
    setTimeout(() => rows[guesses.length].classList.remove('shake'), 460);
  };

  const press = (k) => {
    if (over || busy) return;
    if (k === 'Enter') submit();
    else if (k === 'Backspace') { current = current.slice(0, -1); drawCurrent(); }
    else if (/^[a-z]$/i.test(k) && current.length < 5) { current += k.toLowerCase(); drawCurrent(); }
  };

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Enter' || e.key === 'Backspace' || /^[a-z]$/i.test(e.key)) { e.preventDefault(); press(e.key); }
  });
  $('kb').addEventListener('click', (e) => {
    const k = e.target.closest('.key');
    if (k) { press(k.dataset.k); k.blur(); }
  });

  $('share').addEventListener('click', async () => {
    const won = guesses[guesses.length - 1] === ANSWER;
    const text = `Comm-le #${dayNo + 1} ${won ? guesses.length : 'X'}/6\n${$('grid-result').textContent}\n${location.origin}${location.pathname}`;
    try { await navigator.clipboard.writeText(text); toast('Copied!'); }
    catch {
      const r = document.createRange(); r.selectNodeContents($('grid-result'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      toast('Select and copy');
    }
  });

  // Pick up where today's game left off
  try { guesses = (JSON.parse(localStorage.getItem(KEY)) || []).filter((g) => typeof g === 'string' && g.length === 5).slice(0, 6); } catch { guesses = []; }
  guesses.forEach((g, r) => paintRow(r, g, false));
  paintKeys();
  if (guesses.includes(ANSWER)) { guesses = guesses.slice(0, guesses.indexOf(ANSWER) + 1); finish(true, false); }
  else if (guesses.length === 6) finish(false, false);
</script>
